theme: jekyll-theme-cayman
title: Horizon Daily
description: 面向非技术学习者的每日 AI 热点、应用与实战摘要
baseurl: "/horizon-ai-daily"
url: "https://naler666.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"

