name: Daily Horizon Summary

on:
  schedule:
    # 22:30 UTC = 06:30 Asia/Shanghai (GitHub schedules may start a little late)
    - cron: '30 22 * * *'
  # Updating this workflow also performs a cloud smoke test.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-summary.yml'
      - 'data/config.github.json'
      - 'profiles/ai-creator/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon with DeepSeek V4 Flash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24 --log-level INFO

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Publish daily briefing to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Horizon summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

